<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Management</title>
</head>

<body>

    <h1>Quiz Management</h1>

    <!-- ============================= -->
    <!-- CREATE QUIZ -->
    <!-- ============================= -->

    <h2>Create Quiz</h2>

    <form id="quizForm">

        <input
            type="text"
            id="title"
            placeholder="Quiz title"
            required
        >

        <br><br>

        <textarea
            id="description"
            placeholder="Quiz description"
            required
        ></textarea>

        <br><br>

        <input
            type="number"
            id="duration"
            placeholder="Duration in minutes"
            required
        >

        <br><br>

        <button type="submit">
            Create Quiz
        </button>

    </form>

    <p id="message"></p>


    <!-- ============================= -->
    <!-- QUIZ LIST -->
    <!-- ============================= -->

    <h2>All Quizzes</h2>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Duration</th>
                <th>Published</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="quizTableBody">
        </tbody>

    </table>


    <!-- ============================= -->
    <!-- EDIT QUIZ -->
    <!-- ============================= -->

    <div id="editSection" style="display:none;">

        <h2>Edit Quiz</h2>

        <form id="editQuizForm">

            <input
                type="hidden"
                id="editId"
            >

            <input
                type="text"
                id="editTitle"
                placeholder="Quiz title"
                required
            >

            <br><br>

            <textarea
                id="editDescription"
                placeholder="Quiz description"
                required
            ></textarea>

            <br><br>

            <input
                type="number"
                id="editDuration"
                placeholder="Duration"
                required
            >

            <br><br>

            <button type="submit">
                Update Quiz
            </button>

            <button
                type="button"
                id="cancelEdit"
            >
                Cancel
            </button>

        </form>

    </div>


    <script src="js/quiz-management.js"></script>

</body>
</html>
